standards:
- id: ucp
  name: Universal Commerce Protocol
  conforms: true
  version: '2026-04-08'
  evidence: >-
    https://mgemi.com/.well-known/ucp returns a UCP merchant profile declaring
    version 2026-04-08 with 2026-01-23 also supported, service dev.ucp.shopping over
    transport "mcp", and eight capability namespaces (catalog.search, catalog.lookup,
    cart, checkout, fulfillment, discount, order, dev.shopify.catalog).
    https://mgemi.com/llms.txt states "This store implements the Universal Commerce
    Protocol (UCP) for agent-driven commerce."
- id: mcp
  name: Model Context Protocol
  conforms: true
  version_negotiated: '2024-11-05'
  evidence: >-
    Anonymous JSON-RPC 2.0 initialize against https://mgemi.com/api/ucp/mcp returns
    serverInfo {name: universal-commerce, version: 0.1.0} and protocolVersion 2024-11-05;
    tools/list returns 13 tools each with a JSON Schema inputSchema.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: >-
    All MCP traffic is JSON-RPC 2.0; an unknown method returns a well-formed error object
    {"code":-32001,"message":"UCP discovery failed","data":{...}}.
- id: json-schema-2020-12
  name: JSON Schema 2020-12
  conforms: true
  evidence: >-
    Every tool inputSchema in mcp/m-gemi-mcp-tools-list.json declares
    "$schema":"https://json-schema.org/draft/2020-12/schema".
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://mgemi.com/.well-known/openid-configuration returns a complete discovery
    document (issuer, authorization_endpoint, token_endpoint, jwks_uri,
    id_token_signing_alg_values_supported RS256, claims_supported).
- id: oauth2
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    https://mgemi.com/.well-known/oauth-authorization-server returns RFC 8414 metadata
    with code_challenge_methods_supported [S256] and grant_types_supported
