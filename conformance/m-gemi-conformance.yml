domain_standard:
  market: retail / e-commerce / agentic commerce
  standard: Universal Commerce Protocol (UCP) 2026-04-08
  declared_in_contract: true
  evidence: >-
    The contract declares the standard about itself, not merely in marketing prose: the
    merchant profile at https://mgemi.com/.well-known/ucp names service "dev.ucp.shopping"
    against spec https://ucp.dev/2026-04-08/specification/overview/ and binds each
    capability to a published ucp.dev JSON Schema
    (https://ucp.dev/2026-04-08/schemas/shopping/checkout.json, cart.json,
    catalog_search.json, catalog_lookup.json, fulfillment.json, discount.json,
    order.json). Payment handlers are namespaced to their own published specs
    (com.google.pay, dev.shopify.card, dev.shopify.shop_pay). An agent that already speaks
    UCP transacts with M.Gemi with no bespoke connector.
  note: >-
    UCP is implemented by the Shopify platform on M.Gemi's behalf rather than authored by
    M.Gemi. The conformance is real and buyer-visible on M.Gemi's own host; the credit for
    the implementation belongs to the platform.
