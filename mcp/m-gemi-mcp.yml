generated: '2026-08-25'
method: probed
source: https://mgemi.com/api/ucp/mcp (anonymous JSON-RPC tools/list + initialize, 2026-08-25)
name: M.Gemi UCP Commerce MCP Server
description: >-
  The Universal Commerce Protocol (UCP) shopping service for the M.Gemi store, exposed
  over Model Context Protocol. Advertised by the store's own /llms.txt and /agents.md and
  registered in the UCP merchant profile at https://mgemi.com/.well-known/ucp under
  service dev.ucp.shopping with transport "mcp".
deployment:
  mode: remote
  endpoint: https://mgemi.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    tools/list and initialize answer anonymously with no credential. tools/call is not
    keyless: every tool requires meta.ucp-agent.profile (an agent profile URI) and a call
    without one returns JSON-RPC error -32001 "UCP discovery failed" / invalid_profile_url.
    The UCP profile also lists an alternate endpoint on the myshopify host,
    https://mgemi.myshopify.com/api/ucp/mcp, and a non-MCP "embedded" transport.
server_info:
  name: universal-commerce
  version: 0.1.0
  protocol_version_negotiated: '2024-11-05'
  capabilities:
    tools:
      listChanged: true
    prompts:
      listChanged: true
    resources:
      listChanged: true
    logging: {}
ucp:
  version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  discovery: https://mgemi.com/.well-known/ucp
  capabilities:
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.order
  - dev.shopify.catalog
  payment_handlers:
  - com.google.pay
  - dev.shopify.card
  - dev.shopify.shop_pay
tools_source: mcp/m-gemi-mcp-tools-list.json
tool_count: 13
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
  required: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart.
  required: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, including line items, totals,
    and any applicable discounts or taxes.
  required: [meta, checkout]
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, and any
    applicable discounts or taxes.
  required: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout. Returns checkout details, including line items, totals,
    and any applicable discounts or taxes.
  required: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: Completes a checkout and returns the checkout result, including order ID
    and Thank You Page URL. Buyer approval is required at the moment of payment.
  required: [meta, id, checkout]
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order.
  required: [meta, id]
conventions:
  money: >-
    All prices are integers in ISO 4217 minor units paired with a currency code -
    {"amount": 2500, "currency": "USD"} is $25.00. Zero-decimal currencies such as JPY are
    already whole units. Stated verbatim in every tool description.
  identifiers: Shopify global IDs, e.g. gid://shopify/Checkout/abc123
provenance_note: >-
  This is a merchant-tenant surface. The UCP/MCP server is Shopify platform
  infrastructure, but it is served from M.Gemi's own host, scoped to M.Gemi's shop
  (shop_id 13666484283, merchant_name "M.Gemi", merchant_origin mgemi.com in the UCP
  Google Pay handler config) and returns M.Gemi's own catalog. M.Gemi does not operate a
  developer program; this is its agent-commerce surface.
