apis:
- name: M.Gemi UCP Commerce MCP API
  description: 'The Universal Commerce Protocol (UCP) shopping service for the M.Gemi
    store, exposed over Model Context Protocol at https://mgemi.com/api/ucp/mcp. An
    anonymous tools/list returns 13 tools with full JSON Schema inputSchemas covering
    catalog search and lookup, product detail, cart create/read/update/cancel, and
    checkout create/read/update/complete/cancel plus order retrieval. Checkout
    completion requires contemporaneous buyer approval per the store agent instructions.'
  humanURL: https://mgemi.com/llms.txt
  baseURL: https://mgemi.com/api/ucp/mcp
