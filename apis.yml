- name: M.Gemi Storefront Product JSON
  description: 'The read-only Shopify storefront JSON surface for the M.Gemi catalog,
    documented by the store''s own /llms.txt for agents that only need to read store
    data without transacting: /products.json, /products/{handle}.json,
    /collections/{handle}/products.json, /cart.js, /meta.json and /search. No
    authentication is required. The store publishes 2,407 products across 709
    collections.'
