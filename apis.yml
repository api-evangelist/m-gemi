aid: m-gemi
name: M.Gemi
description: 'M.Gemi is a Boston-based direct-to-consumer footwear and leather-goods
  brand founded in 2015 by Maria Gangemi and Cheryl Kaplan, selling handcrafted Italian
  shoes and handbags made in small batches by family-owned workshops across Italy and
  released weekly. Its public API surface is not a developer program but an agent-commerce
  surface: the mgemi.com storefront publishes an /llms.txt and /agents.md agent instruction
  document, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and a
  live, unauthenticated Model Context Protocol endpoint at /api/ucp/mcp exposing 13 tools for
  catalog search, cart, checkout and order retrieval, alongside the read-only Shopify storefront
  product JSON endpoints its own agent instructions document. Customer identity is served by a
  Shopify Customer Account OpenID Connect discovery document on the store host.'
